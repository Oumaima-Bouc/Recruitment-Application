name: Email Service Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke test
        env:
          SERVICE_URL: ${{ secrets.PRODUCTION_EMAIL_URL }}
          TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then echo "PRODUCTION_EMAIL_URL secret is not set"; exit 1; fi
          if [ -z "$TEST_EMAIL" ]; then echo "SMOKE_TEST_EMAIL secret is not set"; exit 1; fi
          echo "Sending verification POST to $SERVICE_URL"
          curl -sSf -X POST -H "Content-Type: application/json" -d '{"email":"'$TEST_EMAIL'","code":"1234"}' $SERVICE_URL/send-verification
          echo "Smoke test request sent. Check service logs or inbox for delivery."
